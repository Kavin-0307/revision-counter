<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revision Counter</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #3fb950;
    --accent-dim: #1f6feb;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--mono); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  header { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--border); padding: 14px 18px; }
  .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  h1 { font-size: 15px; margin: 0; letter-spacing: 0.5px; }
  h1 .dim { color: var(--muted); font-weight: normal; }
  .stats { display: flex; gap: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .stats b { color: var(--accent); }
  .sync-status { font-size: 11px; color: var(--muted); }
  .sync-status.ok { color: var(--accent); }
  .sync-status.err { color: #f85149; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type="text"] { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 6px; font-family: var(--mono); font-size: 13px; flex: 1; min-width: 160px; }
  select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 6px; font-family: var(--mono); font-size: 13px; }
  button.reset-all { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 7px 10px; border-radius: 6px; font-family: var(--mono); font-size: 12px; cursor: pointer; }
  button.reset-all:hover { border-color: #f85149; color: #f85149; }
  main { padding: 12px 18px 60px; max-width: 900px; margin: 0 auto; }
  .topic-group { margin-top: 22px; }
  .topic-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 6px; border: 1px solid transparent; }
  .row:hover { background: var(--panel); border-color: var(--border); }
  .row-left { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .name { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pattern { font-size: 10.5px; color: var(--muted); background: var(--bg); border: 1px solid var(--border); padding: 1px 6px; border-radius: 10px; flex-shrink: 0; }
  .row-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .count { font-size: 13px; min-width: 18px; text-align: center; color: var(--muted); }
  .count.nonzero { color: var(--accent); font-weight: bold; }
  .revise-btn { background: var(--accent-dim); color: white; border: none; padding: 5px 12px; border-radius: 6px; font-family: var(--mono); font-size: 12px; cursor: pointer; }
  .revise-btn.hit { background: var(--accent); }
  .undo-btn { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 5px 8px; border-radius: 6px; font-family: var(--mono); font-size: 11px; cursor: pointer; }
  .undo-btn:hover { border-color: #f85149; color: #f85149; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 13px; }
  .setup-banner { background: #3d2c00; border: 1px solid #7a5c00; color: #f0d264; padding: 12px 16px; margin: 14px 18px; border-radius: 6px; font-size: 12.5px; line-height: 1.6; }
  .setup-banner code { background: #00000040; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>revision<span class="dim">.log</span></h1>
    <div class="stats">
      <span>problems: <b id="stat-total">0</b></span>
      <span>revised: <b id="stat-touched">0</b></span>
      <span>total reps: <b id="stat-revisions">0</b></span>
      <span class="sync-status" id="sync-status">not configured</span>
    </div>
  </div>
  <div class="controls">
    <input type="text" id="search" placeholder="filter by name...">
    <select id="topicFilter"></select>
    <select id="sortBy">
      <option value="default">sort: default</option>
      <option value="most">sort: most revised</option>
      <option value="least">sort: least revised</option>
    </select>
    <button class="reset-all" id="resetAll">reset all</button>
  </div>
</header>

</div>

boring-movies", "pattern": ""}, {"topic": "SQL", "name": "rearrange-products-table", "pattern": ""}, {"topic": "SQL", "name": "recyclable-and-low-fat-products", "pattern": ""}, {"topic": "SQL", "name": "rising-temperature", "pattern": ""}];

let counts = {};
let db = null;
let userId = null;
let configured = FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY";

const DOC_PATH = () => doc(db, "revisionCounters", userId);

function keyFor(p) { return p.topic + '::' + p.name; }

function setSyncStatus(text, cls) {
  const el = document.getElementById('sync-status');
  el.textContent = text;
  el.className = 'sync-status ' + (cls || '');
}

async function loadCounts() {
  if (!configured) return;
  try {
    const snap = await getDoc(DOC_PATH());
    counts = snap.exists() ? (snap.data().counts || {}) : {};
    setSyncStatus('synced', 'ok');
  } catch (e) {
    console.error(e);
    setSyncStatus('sync error', 'err');
  }
}

let saveTimer = null;
async function persistCounts() {
  if (!configured) return;
  setSyncStatus('saving...', '');
  try {
    await setDoc(DOC_PATH(), { counts, updatedAt: Date.now() });
    setSyncStatus('synced', 'ok');
  } catch (e) {
    console.error(e);
    setSyncStatus('sync error', 'err');
  }
}

async function setCount(p, val) {
  counts[keyFor(p)] = val;
  await persistCounts();
}

function uniqueTopics() {
  const seen = [];
  for (const p of PROBLEMS) if (!seen.includes(p.topic)) seen.push(p.topic);
  return seen;
}

function populateTopicFilter() {
  const sel = document.getElementById('topicFilter');
  sel.innerHTML = '<option value="all">all topics</option>' +
    uniqueTopics().map(t => `<option value="${t}">${t}</option>`).join('');
}

function currentFilters() {
  return {
    search: document.getElementById('search').value.trim().toLowerCase(),
    topic: document.getElementById('topicFilter').value,
    sort: document.getElementById('sortBy').value,
  };
}

function cssKey(p) { return keyFor(p).replace(/[^a-zA-Z0-9]/g, '_'); }

function rowHtml(p) {
  const c = counts[keyFor(p)] || 0;
  return `
    <div class="row" data-key="${keyFor(p)}">
      <div class="row-left">
        <span class="name">${p.name}</span>
        ${p.pattern ? `<span class="pattern">${p.pattern}</span>` : ''}
      </div>
      <div class="row-right">
        <span class="count ${c > 0 ? 'nonzero' : ''}" id="count-${cssKey(p)}">${c}</span>
        <button class="undo-btn" data-key="${keyFor(p)}" ${c === 0 ? 'style="visibility:hidden"' : ''}>&minus;</button>
        <button class="revise-btn" data-key="${keyFor(p)}">Revise</button>
      </div>
    </div>`;
}

function render() {
  const { search, topic, sort } = currentFilters();
  const main = document.getElementById('main');

  let filtered = PROBLEMS.filter(p => {
    if (topic !== 'all' && p.topic !== topic) return false;
    if (search && !p.name.toLowerCase().includes(search)) return false;
    return true;
  });

  if (sort === 'most') filtered = [...filtered].sort((a, b) => (counts[keyFor(b)]||0) - (counts[keyFor(a)]||0));
  else if (sort === 'least') filtered = [...filtered].sort((a, b) => (counts[keyFor(a)]||0) - (counts[keyFor(b)]||0));

  if (filtered.length === 0) {
    main.innerHTML = '<div class="empty">no problems match</div>';
    updateStats();
    return;
  }

  let html = '';
  if (sort === 'default') {
    const groups = {};
    const order = [];
    for (const p of filtered) {
      if (!groups[p.topic]) { groups[p.topic] = []; order.push(p.topic); }
      groups[p.topic].push(p);
    }
    for (const t of order) {
      html += `<div class="topic-group"><div class="topic-title"><span>${t}</span><span>${groups[t].length}</span></div>`;
      for (const p of groups[t]) html += rowHtml(p);
      html += `</div>`;
    }
  } else {
    html += `<div class="topic-group"><div class="topic-title"><span>results</span><span>${filtered.length}</span></div>`;
    for (const p of filtered) html += rowHtml(p);
    html += `</div>`;
  }

  main.innerHTML = html;
  main.querySelectorAll('.revise-btn').forEach(btn => btn.addEventListener('click', onRevise));
  main.querySelectorAll('.undo-btn').forEach(btn => btn.addEventListener('click', onUndo));
  updateStats();
}

async function onRevise(e) {
  const key = e.target.getAttribute('data-key');
  const p = PROBLEMS.find(pp => keyFor(pp) === key);
  await setCount(p, (counts[key] || 0) + 1);
  e.target.classList.add('hit');
  setTimeout(() => e.target.classList.remove('hit'), 150);
  render();
}

async function onUndo(e) {
  const key = e.target.getAttribute('data-key');
  const p = PROBLEMS.find(pp => keyFor(pp) === key);
  await setCount(p, Math.max(0, (counts[key] || 0) - 1));
  render();
}

function updateStats() {
  let touched = 0, revisions = 0;
  for (const p of PROBLEMS) {
    const c = counts[keyFor(p)] || 0;
    if (c > 0) touched++;
    revisions += c;
  }
  document.getElementById('stat-total').textContent = PROBLEMS.length;
  document.getElementById('stat-touched').textContent = touched;
  document.getElementById('stat-revisions').textContent = revisions;
}

async function resetAll() {
  if (!confirm('Reset ALL revision counts to zero? This cannot be undone.')) return;
  for (const p of PROBLEMS) counts[keyFor(p)] = 0;
  await persistCounts();
  render();
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('topicFilter').addEventListener('change', render);
document.getElementById('sortBy').addEventListener('change', render);
document.getElementById('resetAll').addEventListener('click', resetAll);

(async function init() {
  populateTopicFilter();

  if (!configured) {
    document.getElementById('setupBanner').style.display = 'block';
    setSyncStatus('not configured', 'err');
    render();
    return;
  }

  const app = initializeApp(FIREBASE_CONFIG);
  db = getFirestore(app);
  const auth = getAuth(app);

  setSyncStatus('connecting...', '');

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      userId = user.uid;
      await loadCounts();
      render();
    }
  });

  try {
    await signInAnonymously(auth);
  } catch (e) {
    console.error(e);
    setSyncStatus('auth error', 'err');
    render();
  }
})();
</script>
